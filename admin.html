<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #f5f5f5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button { font: inherit; }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .description {
            margin-bottom: 24px;
            color: #777;
            line-height: 1.6;
        }

        .status {
            padding: 16px;
            border-radius: 10px;
            background: #f5f5f5;
            line-height: 1.7;
        }

        .success {
            background: #e8f5e9;
            color: #087f23;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .loading { color: #666; }

        .dashboard-content {
            display: none;
            margin-top: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .metric-card {
            min-width: 0;
            padding: 18px 14px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            text-align: center;
        }

        .metric-label {
            margin-bottom: 8px;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .metric-value {
            color: #222;
            font-size: 30px;
            font-weight: bold;
            line-height: 1.2;
        }

        .metric-unit {
            margin-left: 2px;
            color: #777;
            font-size: 13px;
            font-weight: normal;
        }

        .updated-at {
            margin-top: 16px;
            color: #999;
            font-size: 12px;
            text-align: right;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .refresh-button {
            background: #222;
            color: white;
        }

        .back-button {
            background: #eeeeee;
            color: #555;
        }

        .action-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        
        .admin-tab {
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            color: #555;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .admin-tab.active {
            background: #222;
            color: white;
            border-color: #222;
        }
        
        .admin-panel {
            display: none;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-table-wrap {
            width: 100%;
            overflow-x: auto;
            margin-top: 16px;
        }
        
        .admin-table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .admin-table th,
        .admin-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }
        
        .admin-table th {
            background: #f5f5f5;
            white-space: nowrap;
        }
        
        .admin-table td {
            max-width: 240px;
            word-break: break-word;
        }
        
        .admin-search {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }
        
        @media (min-width: 720px) {
            .metrics-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .container { margin: 18px auto; }
            .card { padding: 18px; }
            .metric-value { font-size: 26px; }
            .button-row { flex-direction: column; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>管理ダッシュボード</h1>

            <div class="description">
                ユーザー数や経費登録状況を確認できます。
            </div>

            <div id="status" class="status loading">
                認証処理中です...
            </div>

            <div id="dashboardContent" class="dashboard-content">

                <div class="admin-tabs">
                    <button
                        id="overviewTab"
                        class="admin-tab active"
                        onclick="showAdminPanel('overview')">
                        概要
                    </button>
            
                    <button
                        id="currentExpensesTab"
                        class="admin-tab"
                        onclick="showAdminPanel('currentExpenses')">
                        現在の経費
                    </button>
                </div>
            
                <div
                    id="overviewPanel"
                    class="admin-panel active"
                >
            
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">ユーザー総数</div>
                        <div class="metric-value">
                            <span id="totalUsers">-</span>
                            <span class="metric-unit">人</span>
                        </div>
                    </div>

                    <div class="metric-card">
                        <div class="metric-label">無料ユーザー</div>
                        <div class="metric-value">
                            <span id="freeUsers">-</span>
                            <span class="metric-unit">人</span>
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">980円プラン</div>
                        <div class="metric-value">
                            <span id="plan980Users">-</span>
                            <span class="metric-unit">人</span>
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">1,280円プラン</div>
                        <div class="metric-value">
                            <span id="plan1280Users">-</span>
                            <span class="metric-unit">人</span>
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">有料会員合計</div>
                        <div class="metric-value">
                            <span id="paidUsers">-</span>
                            <span class="metric-unit">人</span>
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">月間売上見込み</div>
                        <div class="metric-value">
                            <span id="monthlyRevenue">-</span>
                            <span class="metric-unit">円</span>
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">今日の登録件数</div>
                        <div class="metric-value">
                            <span id="todayRecords">-</span>
                            <span class="metric-unit">件</span>
                        </div>
                    </div>

                    <div class="metric-card">
                        <div class="metric-label">今月の登録件数</div>
                        <div class="metric-value">
                            <span id="monthRecords">-</span>
                            <span class="metric-unit">件</span>
                        </div>
                    </div>

                    <div class="metric-card">
                        <div class="metric-label">確認途中の件数</div>
                        <div class="metric-value">
                            <span id="pendingCount">-</span>
                            <span class="metric-unit">件</span>
                        </div>
                    </div>
                </div>

                <div id="updatedAt" class="updated-at">
                    最終更新：-
                </div>

                </div>

                <div
                    id="currentExpensesPanel"
                    class="admin-panel"
                >
                    <h2>現在登録されている経費</h2>
                
                    <input
                        id="currentExpensesSearch"
                        class="admin-search"
                        type="text"
                        placeholder="支払先・内容・科目・メモ・ユーザーIDで検索"
                        oninput="renderCurrentExpenses()"
                    >
                
                    <div
                        id="currentExpensesCount"
                        class="updated-at"
                        style="text-align:left;"
                    >
                        -
                    </div>
                
                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>日付</th>
                                    <th>支払先</th>
                                    <th>内容</th>
                                    <th>金額</th>
                                    <th>勘定科目</th>
                                    <th>支払方法</th>
                                    <th>メモ</th>
                                    <th>ユーザーID</th>
                                </tr>
                            </thead>
                
                            <tbody id="currentExpensesBody">
                                <tr>
                                    <td colspan="8">
                                        読み込み前です
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="button-row">
                    <button
                        id="refreshButton"
                        class="action-button refresh-button"
                        onclick="refreshDashboard()">
                        最新情報に更新
                    </button>

                    <button
                        class="action-button back-button"
                        onclick="backToMyPage()">
                        マイページへ戻る
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== Render API =====
        const API_BASE_URL =
            'https://voiceflow-8t12.onrender.com'

        // ===== LIFF ID =====
        const LIFF_ID =
            '2010043850-PaxG9LLM'

        let currentExpenses = []

        // ===== メッセージ表示 =====
        function showStatus(message, type = 'loading') {
            const statusElement =
                document.getElementById('status')

            statusElement.textContent = message
            statusElement.className = `status ${type}`
        }


        // ===== LINEログインまたはLIFF再起動 =====
        function restartLineLogin() {
            const redirectUrl =
                window.location.origin
                + window.location.pathname

            if (liff.isInClient()) {
                window.location.href =
                    `https://liff.line.me/${LIFF_ID}`
                return
            }

            liff.login({
                redirectUri: redirectUrl
            })
        }


        // ===== 管理者API共通処理 =====
        async function requestAdminApi(path) {
            const idToken =
                liff.getIDToken()

            if (!idToken) {
                throw new Error(
                    'LINE認証情報を取得できませんでした'
                )
            }

            const response = await fetch(
                `${API_BASE_URL}${path}`,
                {
                    method: 'GET',
                    headers: {
                        'Authorization':
                            `Bearer ${idToken}`
                    },
                    cache: 'no-store'
                }
            )

            let result = null

            try {
                result = await response.json()
            } catch (error) {
                throw new Error(
                    'サーバーから正しい応答がありません'
                )
            }

            // ===== IDトークン期限切れ =====
            if (response.status === 401) {
                const alreadyRetried =
                    sessionStorage.getItem(
                        'admin_reauth_attempted'
                    ) === '1'

                if (!alreadyRetried) {
                    sessionStorage.setItem(
                        'admin_reauth_attempted',
                        '1'
                    )

                    try {
                        if (liff.isLoggedIn()) {
                            liff.logout()
                        }
                    } catch (error) {
                        console.error(
                            'LIFFログアウトエラー',
                            error
                        )
                    }

                    restartLineLogin()
                    return new Promise(() => {})
                }

                throw new Error(
                    result?.error
                    || 'LINE認証の有効期限が切れています'
                )
            }

            // ===== 管理者ではない =====
            if (response.status === 403) {
                throw new Error(
                    'このLINEアカウントには管理者権限がありません'
                )
            }

            if (
                !response.ok
                || !result
                || result.success !== true
            ) {
                throw new Error(
                    result?.error
                    || '管理データの取得に失敗しました'
                )
            }

            sessionStorage.removeItem(
                'admin_reauth_attempted'
            )

            return result
        }


        // ===== 管理者認証APIを実行 =====
        async function checkAdminAuth() {
            await requestAdminApi(
                '/api/admin/auth-check'
            )
        }


        // ===== 数値表示 =====
        function formatCount(value) {
            const numberValue = Number(value)

            if (!Number.isFinite(numberValue)) {
                return '0'
            }

            return numberValue.toLocaleString('ja-JP')
        }


        // ===== 最終更新日時表示 =====
        function formatGeneratedAt(value) {
            if (!value) {
                return '-'
            }

            const date = new Date(value)

            if (Number.isNaN(date.getTime())) {
                return '-'
            }

            return date.toLocaleString(
                'ja-JP',
                {
                    timeZone: 'Asia/Tokyo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            )
        }


        // ===== 集計データ表示 =====
        function displayMetrics(metrics) {
            document.getElementById(
                'totalUsers'
            ).textContent =
                formatCount(metrics.total_users)

            document.getElementById(
                'freeUsers'
            ).textContent =
                formatCount(
                    metrics.free_users
                )
            
            document.getElementById(
                'plan980Users'
            ).textContent =
                formatCount(
                    metrics.plan_980_users
                )
            
            document.getElementById(
                'plan1280Users'
            ).textContent =
                formatCount(
                    metrics.plan_1280_users
                )
            
            document.getElementById(
                'paidUsers'
            ).textContent =
                formatCount(
                    metrics.paid_users
                )
            
            document.getElementById(
                'monthlyRevenue'
            ).textContent =
                formatCount(
                    metrics.monthly_revenue_yen
                )
            
            document.getElementById(
                'todayRecords'
            ).textContent =
                formatCount(metrics.today_records)

            document.getElementById(
                'monthRecords'
            ).textContent =
                formatCount(metrics.month_records)

            document.getElementById(
                'pendingCount'
            ).textContent =
                formatCount(metrics.pending_count)

            document.getElementById(
                'updatedAt'
            ).textContent =
                '最終更新：'
                + formatGeneratedAt(
                    metrics.generated_at
                )

            document.getElementById(
                'dashboardContent'
            ).style.display = 'block'
        }


        // ===== 管理ダッシュボード取得 =====
        async function loadDashboardMetrics() {
            const result =
                await requestAdminApi(
                    '/api/admin/dashboard-metrics'
                )

            const metrics = result.metrics

            if (
                !metrics
                || typeof metrics !== 'object'
                || Array.isArray(metrics)
            ) {
                throw new Error(
                    '管理データの形式が正しくありません'
                )
            }

            displayMetrics(metrics)
        }


        // ===== HTML安全表示 =====
        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;')
        }
        
        
        // ===== 管理画面タブ切替 =====
        async function showAdminPanel(panelName) {
        
            document
                .querySelectorAll('.admin-panel')
                .forEach(panel => {
                    panel.classList.remove('active')
                })
        
            document
                .querySelectorAll('.admin-tab')
                .forEach(tab => {
                    tab.classList.remove('active')
                })
        
            if (panelName === 'overview') {
        
                document
                    .getElementById('overviewPanel')
                    .classList.add('active')
        
                document
                    .getElementById('overviewTab')
                    .classList.add('active')
        
                return
            }
        
            if (panelName === 'currentExpenses') {
        
                document
                    .getElementById('currentExpensesPanel')
                    .classList.add('active')
        
                document
                    .getElementById('currentExpensesTab')
                    .classList.add('active')
        
                await loadCurrentExpenses()
            }
        }
        
        
        // ===== 現在経費取得 =====
        async function loadCurrentExpenses() {
        
            showStatus(
                '現在の経費を取得しています...',
                'loading'
            )
        
            try {
        
                const result =
                    await requestAdminApi(
                        '/api/admin/current-expenses'
                    )
        
                currentExpenses =
                    Array.isArray(result.records)
                        ? result.records
                        : []
        
                renderCurrentExpenses()
        
                showStatus(
                    '管理者認証済み・現在の経費を表示しています。',
                    'success'
                )
        
            } catch (error) {
        
                console.error(
                    '現在経費取得エラー',
                    error
                )
        
                showStatus(
                    error.message
                    || '現在の経費を取得できませんでした',
                    'error'
                )
            }
        }
        
        
        // ===== 現在経費表示 =====
        function renderCurrentExpenses() {
        
            const keyword =
                (
                    document.getElementById(
                        'currentExpensesSearch'
                    )?.value
                    || ''
                )
                .trim()
                .toLowerCase()
        
            let records = currentExpenses
        
            if (keyword) {
        
                records =
                    records.filter(record => {
        
                        const target = [
                            record.user_id,
                            record.date,
                            record.store,
                            record.item,
                            record.amount,
                            record.account,
                            record.payment,
                            record.memo
                        ]
                        .map(value =>
                            String(value ?? '')
                                .toLowerCase()
                        )
                        .join(' ')
        
                        return target.includes(keyword)
                    })
            }
        
            document.getElementById(
                'currentExpensesCount'
            ).textContent =
                `表示件数：${records.length.toLocaleString('ja-JP')}件`
        
            const body =
                document.getElementById(
                    'currentExpensesBody'
                )
        
            if (records.length === 0) {
        
                body.innerHTML = `
                    <tr>
                        <td colspan="8">
                            該当する経費はありません
                        </td>
                    </tr>
                `
        
                return
            }
        
            body.innerHTML =
                records.map(record => `
        
                    <tr>
                        <td>
                            ${escapeHtml(record.date || '-')}
                        </td>
        
                        <td>
                            ${escapeHtml(record.store || '-')}
                        </td>
        
                        <td>
                            ${escapeHtml(record.item || '-')}
                        </td>
        
                        <td>
                            ${Number(record.amount || 0)
                                .toLocaleString('ja-JP')}円
                        </td>
        
                        <td>
                            ${escapeHtml(record.account || '-')}
                        </td>
        
                        <td>
                            ${escapeHtml(record.payment || '-')}
                        </td>
        
                        <td>
                            ${escapeHtml(record.memo || '-')}
                        </td>
        
                        <td>
                            ${escapeHtml(record.user_id || '-')}
                        </td>
                    </tr>
        
                `).join('')
        }
                
        // ===== 最新情報に更新 =====
        async function refreshDashboard() {
            const refreshButton =
                document.getElementById(
                    'refreshButton'
                )

            refreshButton.disabled = true

            showStatus(
                '最新情報を取得しています...',
                'loading'
            )

            try {
                await loadDashboardMetrics()

                showStatus(
                    '管理者認証済み・最新情報を表示しています。',
                    'success'
                )
            } catch (error) {
                console.error(
                    '管理データ更新エラー',
                    error
                )

                showStatus(
                    error.message
                    || '管理データの更新に失敗しました',
                    'error'
                )
            } finally {
                refreshButton.disabled = false
            }
        }


        // ===== マイページへ戻る =====
        function backToMyPage() {
            window.location.href =
                `${window.location.origin}/index.html`
        }


        // ===== 初期化 =====
        async function initAdminPage() {
            try {
                await liff.init({
                    liffId: LIFF_ID
                })

                if (!liff.isLoggedIn()) {
                    showStatus(
                        'LINEログイン画面へ移動します...',
                        'loading'
                    )

                    restartLineLogin()
                    return
                }

                showStatus(
                    '管理者認証を確認しています...',
                    'loading'
                )

                await checkAdminAuth()

                showStatus(
                    '運営データを読み込んでいます...',
                    'loading'
                )

                await loadDashboardMetrics()

                showStatus(
                    '管理者認証済み・最新情報を表示しています。',
                    'success'
                )
            } catch (error) {
                console.error(
                    '管理画面初期化エラー',
                    error
                )

                showStatus(
                    error.message
                    || '管理画面の読み込みに失敗しました',
                    'error'
                )
            }
        }


        initAdminPage()
    </script>
</body>
</html>
